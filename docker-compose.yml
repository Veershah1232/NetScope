# docker-compose.yml — NetScope Week 2
#
# Starts:
#   - minio          : S3-compatible object storage
#   - minio-init     : creates the netscope-raw bucket on startup
#   - probe-india    : simulated India probe  (probe_id = india-01)
#   - probe-sg       : simulated Singapore probe (probe_id = sg-01)
#   - probe-eu       : simulated Europe probe (probe_id = eu-01)
#
# Usage:
#   docker compose up -d minio minio-init
#   docker compose up probe-india probe-sg probe-eu
#
# Access MinIO console: http://localhost:9001
#   user: minioadmin  password: minioadmin
#
# NOTE: Real geographic diversity requires deploying probes to actual
#       cloud VMs/VPS. These containers run on one machine and produce
#       three probe identities, not real geographic measurements.

networks:
  netscope:
    driver: bridge

volumes:
  minio_data:
  kafka_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:

services:

  # -------------------------------------------------------------------------
  # Prometheus Time-Series Monitoring
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: netscope-prometheus
    networks: [netscope]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Grafana Dashboards & Telemetry Visualization
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: netscope-grafana
    networks: [netscope]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # ClickHouse Analytical Warehouse (OLAP Engine)
  # -------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: netscope-clickhouse
    networks: [netscope]
    ports:
      - "8123:8123"   # HTTP REST / Web interface
      - "9009:9000"   # Native TCP protocol mapped to host 9009 (avoids MinIO 9000 conflict)
    environment:
      CLICKHOUSE_DB: netscope
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./warehouse/schemas/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Apache Kafka in KRaft mode (No Zookeeper dependency)
  # -------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: netscope-kafka
    networks: [netscope]
    ports:
      - "9092:9092"   # Host access
      - "29092:29092" # Internal docker network access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/bin/kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # -------------------------------------------------------------------------
  # Kafka Topic Provisioner (creates measurements, probe_health, alerts)
  # -------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: netscope-kafka-init
    networks: [netscope]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Creating Kafka topics...';
        /bin/kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic measurements --partitions 6 --replication-factor 1;
        /bin/kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic probe_health --partitions 3 --replication-factor 1;
        /bin/kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic alerts --partitions 3 --replication-factor 1;
        echo 'Kafka topics created successfully:';
        /bin/kafka-topics --bootstrap-server kafka:29092 --list;
      "

  # -------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # -------------------------------------------------------------------------
  minio:
    image: pgsty/minio:latest
    container_name: netscope-minio
    networks: [netscope]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # MinIO Init — creates the bucket once MinIO is healthy
  # -------------------------------------------------------------------------
  minio-init:
    image: pgsty/mc:latest
    container_name: netscope-minio-init
    networks: [netscope]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/netscope-raw &&
        echo 'Bucket netscope-raw is ready.'
      "

  # -------------------------------------------------------------------------
  # Local Probes: probe-1 through probe-10
  # Running locally on host via Docker containers.
  # Each probe monitors exactly 15 targets, and no target appears on > 3 probes.
  # -------------------------------------------------------------------------
  probe-1:
    image: deproject-probe-india:latest
    container_name: netscope-probe-01
    networks: [netscope]
    environment:
      PROBE_ID: probe-01
      PROBE_INTERVAL: "30"
      PROBE_OUTPUT: /output/probe-01.jsonl
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: netscope-raw
    volumes:
      - ./results:/output
      - ./targets:/app/targets:ro
    depends_on:
      minio: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

