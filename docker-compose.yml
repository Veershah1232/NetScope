# docker-compose.yml — NetScope Week 2
#
# Starts:
#   - minio          : S3-compatible object storage
#   - minio-init     : creates the netscope-raw bucket on startup
#   - probe-india    : simulated India probe  (probe_id = india-01)
#   - probe-sg       : simulated Singapore probe (probe_id = sg-01)
#   - probe-eu       : simulated Europe probe (probe_id = eu-01)
#
# Usage:
#   docker compose up -d minio minio-init
#   docker compose up probe-india probe-sg probe-eu
#
# Access MinIO console: http://localhost:9001
#   user: minioadmin  password: minioadmin
#
# NOTE: Real geographic diversity requires deploying probes to actual
#       cloud VMs/VPS. These containers run on one machine and produce
#       three probe identities, not real geographic measurements.

networks:
  netscope:
    driver: bridge

volumes:
  minio_data:
  kafka_data:
  clickhouse_data:

services:

  # -------------------------------------------------------------------------
  # ClickHouse Analytical Warehouse (OLAP Engine)
  # -------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: netscope-clickhouse
    networks: [netscope]
    ports:
      - "8123:8123"   # HTTP REST / Web interface
      - "9009:9000"   # Native TCP protocol mapped to host 9009 (avoids MinIO 9000 conflict)
    environment:
      CLICKHOUSE_DB: netscope
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./warehouse/schemas/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Apache Kafka in KRaft mode (No Zookeeper dependency)
  # -------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: netscope-kafka
    networks: [netscope]
    ports:
      - "9092:9092"   # Host access
      - "29092:29092" # Internal docker network access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/bin/kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # -------------------------------------------------------------------------
  # Kafka Topic Provisioner (creates measurements, probe_health, alerts)
  # -------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: netscope-kafka-init
    networks: [netscope]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Creating Kafka topics...';
        /bin/kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic measurements --partitions 6 --replication-factor 1;
        /bin/kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic probe_health --partitions 3 --replication-factor 1;
        /bin/kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic alerts --partitions 3 --replication-factor 1;
        echo 'Kafka topics created successfully:';
        /bin/kafka-topics --bootstrap-server kafka:29092 --list;
      "

  # -------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # -------------------------------------------------------------------------
  minio:
    image: pgsty/minio:latest
    container_name: netscope-minio
    networks: [netscope]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # MinIO Init — creates the bucket once MinIO is healthy
  # -------------------------------------------------------------------------
  minio-init:
    image: pgsty/mc:latest
    container_name: netscope-minio-init
    networks: [netscope]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/netscope-raw &&
        echo 'Bucket netscope-raw is ready.'
      "

  # -------------------------------------------------------------------------
  # Probe — India identity
  # Three identical service definitions, only PROBE_ID differs.
  # In production, each would run on a separate cloud VM.
  # -------------------------------------------------------------------------
  probe-india:
    build:
      context: .
      dockerfile: probe/Dockerfile
    container_name: netscope-probe-india
    networks: [netscope]
    environment:
      PROBE_ID:       india-01
      PROBE_INTERVAL: "30"
      PROBE_OUTPUT:   /output/india-01.jsonl
      MINIO_ENDPOINT:    http://minio:9000
      MINIO_ACCESS_KEY:  minioadmin
      MINIO_SECRET_KEY:  minioadmin
      MINIO_BUCKET:      netscope-raw
    volumes:
      - ./results:/output
      - ./targets:/app/targets:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  probe-sg:
    build:
      context: .
      dockerfile: probe/Dockerfile
    container_name: netscope-probe-sg
    networks: [netscope]
    environment:
      PROBE_ID:       sg-01
      PROBE_INTERVAL: "30"
      PROBE_OUTPUT:   /output/sg-01.jsonl
      MINIO_ENDPOINT:    http://minio:9000
      MINIO_ACCESS_KEY:  minioadmin
      MINIO_SECRET_KEY:  minioadmin
      MINIO_BUCKET:      netscope-raw
    volumes:
      - ./results:/output
      - ./targets:/app/targets:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  probe-eu:
    build:
      context: .
      dockerfile: probe/Dockerfile
    container_name: netscope-probe-eu
    networks: [netscope]
    environment:
      PROBE_ID:       eu-01
      PROBE_INTERVAL: "30"
      PROBE_OUTPUT:   /output/eu-01.jsonl
      MINIO_ENDPOINT:    http://minio:9000
      MINIO_ACCESS_KEY:  minioadmin
      MINIO_SECRET_KEY:  minioadmin
      MINIO_BUCKET:      netscope-raw
    volumes:
      - ./results:/output
      - ./targets:/app/targets:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
