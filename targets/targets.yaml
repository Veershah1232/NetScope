  - id: arxiv-org
    host: arxiv.org
    scheme: https
    path: /
    tags: [academic, research]

  # --- Our controlled test endpoint (inject failures here) ---
  # Replace with actual deployed URL when available
  - id: netscope-ctrl
    host: localhost
    scheme: http
    path: /health
    port: 8080
    tags: [controlled, test, local]
    notes: "Our own controlled endpoint. Use for failure injection experiments."
