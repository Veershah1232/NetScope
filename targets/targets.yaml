# NetScope — Target list
# Start with ~20 targets. Expand as needed.
# Be respectful: normal HTTP/DNS/TCP at ~30s intervals, no aggressive scanning.

targets:

  # --- Global tech / CDN ---
  - id: github-com
    host: github.com
    scheme: https
    path: /
    tags: [global, tech, git]

  - id: google-com
    host: google.com
    scheme: https
    path: /
    tags: [global, search, cdn]

  - id: cloudflare-com
    host: cloudflare.com
    scheme: https
    path: /
    tags: [global, cdn, networking]

  - id: wikipedia-org
    host: wikipedia.org
    scheme: https
    path: /
    tags: [global, content]

  - id: amazon-com
    host: amazon.com
    scheme: https
    path: /
    tags: [global, ecommerce, aws]

  - id: stackoverflow-com
    host: stackoverflow.com
    scheme: https
    path: /
    tags: [global, dev]

  # --- APIs ---
  - id: httpbin-org
    host: httpbin.org
    scheme: https
    path: /get
    tags: [api, test]

  - id: api-github-com
    host: api.github.com
    scheme: https
    path: /
    tags: [api, github]

  # --- CDN / DNS benchmarks ---
  - id: one-one-one-one
    host: one.one.one.one
    scheme: https
    path: /
    tags: [dns, cdn, cloudflare]

  - id: dns-google-com
    host: dns.google
    scheme: https
    path: /
    tags: [dns, google]

  # --- Indian websites ---
