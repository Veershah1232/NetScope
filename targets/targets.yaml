# targets.yaml — NetScope Target Registry (50 Targets Distributed Across 10 Local Probes)
# Exactly 15 targets per probe, each target assigned to exactly 3 probes (max 3).

targets:
  - id: google-com
    host: google.com
    scheme: https
    path: /
    timeout: 10
    probes: [probe-01, probe-02, probe-03]
    tags: ['search', 'global']

