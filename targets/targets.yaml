    host: www.irctc.co.in
    scheme: https
    path: /
    tags: [india, government, rail]

  - id: flipkart-com
    host: www.flipkart.com
    scheme: https
    path: /
    tags: [india, ecommerce]

  - id: myntra-com
    host: www.myntra.com
    scheme: https
    path: /
    tags: [india, ecommerce]

  - id: indiatimes-com
    host: www.indiatimes.com
    scheme: https
    path: /
    tags: [india, media]

  - id: iitb-ac-in
    host: www.iitb.ac.in
    scheme: https
    path: /
    tags: [india, university]

  - id: iitd-ac-in
    host: home.iitd.ac.in
    scheme: https
